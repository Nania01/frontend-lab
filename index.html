<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Какой-то рандомный текст</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="header">Текст для хедера</header>

  <div class="content">
    <aside class="sidebar">
      <h3>Заголовок списка:</h3>
      <ul>
        <li>Опция 1</li>
        <li>Опция 2</li>
        <li>Опция 3</li>
      </ul>
    </aside>

    <main class="main">
      <h1>Заголовок основного блока</h1>
      <p id="greeting">Hello, World!</p>
      <button id="changeGreeting">Поменять приветствие</button>
    </main>

    <aside class="extra">
      Наполнение третьего блока
      <img src="images/ezik.jpg" alt="Ёжик" class="extra-image">
    </aside>
  </div>

  <footer class="footer">
    Ссылки для связи, информация об авторе
  </footer>

  <script src="./script.js"></script>
</body>
</html>
